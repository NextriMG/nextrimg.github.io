<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Le seul en-tête de sécurité posable depuis le document sur GitHub
         Pages, avec la CSP que vite.config.ts injecte à la construction. -->
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <!-- L'onglet ne porte que le nom. La métaphore du site est un système
         d'exploitation : « NEXTRI » seul se lit comme le nom d'une
         application, ce qui sert le propos. Les titres OpenGraph et Twitter
         plus bas gardent la phrase complète : une carte de partage arrive sans
         contexte, là où un onglet est ouvert par quelqu'un qui sait déjà où
         il est. -->
    <title>NEXTRI</title>
    <meta name="description" content="Collectif de trois ingénieurs logiciels à Antananarivo. Prestation en équipe ou en renfort individuel." />
    <link rel="canonical" href="https://nextrimg.github.io/" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://nextrimg.github.io/" />
    <meta property="og:title" content="NEXTRI · Collectif d'ingénieurs logiciels à Antananarivo" />
    <meta property="og:description" content="Collectif de trois ingénieurs logiciels à Antananarivo. Prestation en équipe ou en renfort individuel." />
    <meta property="og:image" content="https://nextrimg.github.io/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="fr_FR" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="NEXTRI · Collectif d'ingénieurs logiciels à Antananarivo" />
    <meta name="twitter:description" content="Collectif de trois ingénieurs logiciels à Antananarivo. Prestation en équipe ou en renfort individuel." />
    <meta name="twitter:image" content="https://nextrimg.github.io/og-image.png" />
    <meta name="theme-color" content="#1c2318" />
    <link rel="icon" type="image/x-icon" href="./favicon.ico" />
    <link rel="icon" type="image/png" sizes="16x16" href="./favicon-16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="./favicon-32.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="./favicon-48.png" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="manifest" href="./site.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet">
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "NEXTRI",
        "url": "https://nextrimg.github.io/",
        "logo": "https://nextrimg.github.io/logo/wordmark-encre.svg",
        "description": "Collectif de trois ingénieurs logiciels à Antananarivo. Prestation en équipe ou en renfort individuel.",
        "address": {
          "@type": "PostalAddress",
          "addressLocality": "Antananarivo",
          "addressCountry": "MG"
        }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
    <script
      src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit"
      defer
    ></script>
  </body>
</html>
