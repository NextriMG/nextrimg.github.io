name: Deploy to GitHub Pages

# Vérifie chaque push ; ne déploie que main.
on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Un groupe par branche : un push de branche n'annule pas un déploiement de main.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          check-latest: true
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run test:run
      - run: npm run build
        env:
          VITE_CONTACT_ENABLED: ${{ secrets.VITE_CONTACT_ENABLED }}
          VITE_WEB3FORMS_KEY: ${{ secrets.VITE_WEB3FORMS_KEY }}
          VITE_TURNSTILE_KEY: ${{ secrets.VITE_TURNSTILE_KEY }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
